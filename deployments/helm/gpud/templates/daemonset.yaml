{{- $podIdentityRecovery := .Values.gpud.podIdentityRecovery | default dict -}}
{{- $containerd := .Values.gpud.containerd | default dict -}}
{{- $explicitRuntime := or $containerd.endpoint $containerd.configPath $containerd.serviceName $containerd.systemctlCommands -}}
{{- /*
RKE2 and K3s embed containerd in their own systemd unit, with the socket under
/run/k3s/containerd and the config under /var/lib/rancher/<distro>, so the
stock defaults find no containerd and the check is skipped. The distro shows up
only in the server version suffix (e.g. v1.36.3+rke2r1), so detection needs Helm
to render against a live API server rather than with --client-only. Any
explicit gpud.containerd value disables detection.
*/ -}}
{{- $distro := "" -}}
{{- if not $explicitRuntime -}}
{{- if contains "+rke2" .Capabilities.KubeVersion.Version -}}
{{- $distro = "rke2" -}}
{{- else if contains "+k3s" .Capabilities.KubeVersion.Version -}}
{{- $distro = "k3s" -}}
{{- end -}}
{{- end -}}
{{- $endpoint := $containerd.endpoint | default "unix:///run/containerd/containerd.sock" -}}
{{- $configPath := $containerd.configPath | default "/etc/containerd/config.toml" -}}
{{- $serviceName := $containerd.serviceName | default "containerd" -}}
{{- if $distro -}}
{{- $endpoint = "unix:///run/k3s/containerd/containerd.sock" -}}
{{- $configPath = printf "/var/lib/rancher/%s/agent/etc/containerd/config.toml" $distro -}}
{{- /* Agent nodes run containerd under the agent unit, server nodes under the server unit. */ -}}
{{- $serviceName = ternary "rke2-agent,rke2-server" "k3s-agent,k3s" (eq $distro "rke2") -}}
{{- end -}}
{{- $configuredRuntime := or $explicitRuntime $distro -}}
{{- if not (hasPrefix "unix:///" $endpoint) -}}
{{- fail "gpud.containerd.endpoint must be unix:///absolute/socket/path" -}}
{{- end -}}
{{- $socketPath := trimPrefix "unix://" $endpoint -}}
{{- if or (eq (clean $socketPath) "/") (contains "?" $socketPath) (contains "#" $socketPath) (contains "%" $socketPath) -}}
{{- fail "gpud.containerd.endpoint must name an absolute socket path without URL escapes, query or fragment" -}}
{{- end -}}
{{- if or (not (hasPrefix "/" $configPath)) (eq (clean $configPath) "/") -}}
{{- fail "gpud.containerd.configPath must be an absolute file path" -}}
{{- end -}}
{{- $activeCommands := .Values.gpud.containerdServiceActiveCommands -}}
{{- if eq $activeCommands nil -}}
{{- $activeCommands = "" -}}
{{- if not $configuredRuntime -}}
{{- $activeCommands = "nsenter --target 1 --mount -- systemctl is-active containerd" -}}
{{- end -}}
{{- end -}}
{{- $hostBinary := .Values.gpud.hostBinary | default dict -}}
{{- $gpudBin := "/usr/local/bin/gpud" -}}
{{- if $hostBinary.enabled -}}
{{- if .Values.gpud.commandOverride -}}
{{- fail "gpud.hostBinary.enabled needs the chart's startup wrapper; unset gpud.commandOverride" -}}
{{- end -}}
{{- $newNodeVersion := $hostBinary.newNodeVersion | default "" | toString -}}
{{- if and $newNodeVersion (ne $newNodeVersion "latest") (not (regexMatch "^v[0-9][0-9A-Za-z.+-]*$" $newNodeVersion)) -}}
{{- fail "gpud.hostBinary.newNodeVersion must be empty, \"latest\", or a release with its v prefix such as v0.14.3" -}}
{{- end -}}
{{- $minVersion := $hostBinary.minVersion | default "" | toString -}}
{{- if and $minVersion (not (regexMatch "^v?[0-9][0-9A-Za-z.+-]*$" $minVersion)) -}}
{{- fail "gpud.hostBinary.minVersion must be empty or a release such as v0.14.3" -}}
{{- end -}}
{{- $gpudBin = "\"$GPUD_BIN\"" -}}
{{- end -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "gpud.fullname" . }}
  labels:
    {{- include "gpud.labels" . | nindent 4 }}
spec:
  # The selector determines which pods the DaemonSet manages.
  # It must match the labels in the pod template.
  selector:
    matchLabels:
      {{- include "gpud.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.updateStrategy.rollingUpdate.maxUnavailable }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      # Allows for custom pod annotations.
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        # These labels are used by the DaemonSet's selector.
        {{- include "gpud.selectorLabels" . | nindent 8 }}
    spec:
      # --- Pod Identity & Security ---
      serviceAccountName: {{ include "gpud.serviceAccountName" . }}
      # K8s auto-mounts SA tokens unless explicitly disabled; see https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#opt-out-of-automounting-service-account-tokens
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # --- Node-level Settings & Lifecycle ---
      # Required for the driver to interact with the host's network stack (e.g. for correct IP reporting).
      # GPUd is intentionally exposed via host networking, so there is no Service object for this chart.
      # Consumers should reach GPUd via each node's IP/port (e.g. https://<node-ip>:15132).
      hostNetwork: true
      # Required for the driver to inspect processes on the host (e.g. via /proc).
      # Also required by the chart-default reboot command: nsenter targets host PID 1
      # so gpud can request a node reboot from inside the container.
      hostPID: true
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      # --- Scheduling ---
      # Mark this pod as a critical add-on to prevent eviction.
      priorityClassName: "system-node-critical"
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # --- Storage ---
      volumes:
        {{- if $podIdentityRecovery.enabled }}
        - name: login-recovery
          projected:
            sources:
              - serviceAccountToken:
                  audience: gpud-machine-proof-recovery
                  expirationSeconds: 600
                  path: token
        {{- end }}
        # System logs directory for GPUd to write logs and monitor system log files
        # Required by: pkg/gpud-manager/systemd/systemd.go (writes to /var/log/gpud.log)
        - name: host-log
          hostPath:
            path: /var/log
            type: Directory

        # Persistent storage for kernel crash dumps and system error logs
        # Required for: analyzing system crashes and kernel panics
        - name: host-pstore
          hostPath:
            path: /var/lib/systemd/pstore
            type: DirectoryOrCreate

        # Device files for hardware access and kernel message buffer
        # Required by: pkg/kmsg/watcher.go:46 (reads /dev/kmsg for kernel messages)
        # Also provides access to GPU devices (/dev/nvidia*), block devices, etc.
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory

        {{- if .Values.gpud.mountHostSys }}
        # Sysfs virtual filesystem for hardware and device information
        # Required by:
        # - components/accelerator/nvidia/infiniband/class/class.go:34 (/sys/class/infiniband - InfiniBand monitoring)
        # - pkg/host/machine_id.go:152 (/sys/class/dmi - DMI/hardware info for machine ID)
        # - pkg/fuse/fuse.go:18 (/sys/fs/fuse/connections - FUSE filesystem monitoring)
        # Can be disabled for security-sensitive environments via gpud.mountHostSys=false
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        {{- end }}

        {{- if .Values.gpud.mountHostProc }}
        # Procfs virtual filesystem for process and kernel information
        # Required by:
        # - pkg/file/descriptors_linux.go:27,41 (/proc/sys/fs/file-max, file-nr - file descriptor limits)
        # - pkg/host/boot_id.go:9 (/proc/sys/kernel/random/boot_id - unique boot identifier)
        # - pkg/disk/mount.go:14,105 (/proc/self/mountinfo - mount point information)
        # Can be disabled for security-sensitive environments via gpud.mountHostProc=false
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        {{- end }}

        # GPUd's persistent data directory for state, cache, and configuration
        - name: lib-gpud
          hostPath:
            path: /var/lib/gpud
            type: DirectoryOrCreate

        {{- if .Values.nodeLabelExporter.enabled }}
        # Pod-scoped scratch space for the node-label snapshot that
        # node-label-init hands to gpud. An emptyDir rather than the
        # /var/lib/gpud hostPath: gpud reads the file once at startup, so it
        # has no reason to persist on the host, and a fresh volume per pod
        # means no stale label file from a previous release can leak in.
        - name: node-labels
          emptyDir: {}
        {{- end }}

        # Machine ID for unique node identification
        # Required by: pkg/host/machine_id.go (reads machine-id for node identification)
        - name: host-machine-id
          hostPath:
            path: /etc/machine-id
            type: FileOrCreate

        {{- if .Values.gpud.mountHostDevMem }}
        # Required for direct memory access to inspect hardware state (e.g. PCIe config space).
        # Addressed https://github.com/leptonai/gpud/issues/1144:
        # On some environments (e.g. GKE), /dev/mem may not be exposed or not be a CharDevice.
        # This conditional allows disabling the mount to prevent pod startup failures.
        - name: host-dev-mem
          hostPath:
            path: /dev/mem
            # We explicitly specify CharDevice to ensure we are mounting the correct device.
            # If this fails, set gpud.mountHostDevMem to false.
            type: CharDevice
        {{- end }}

        # Kubelet directory for container and pod information
        # Required for: monitoring containerized workloads and Kubernetes integration
        - name: host-kubelet-vol
          hostPath:
            path: /var/lib/kubelet
            type: DirectoryOrCreate

        # Rancher (k3s/RKE2) agent directory for kubelet client credentials
        # Required by: components/containerd dangling pod detection, which reads
        # kubelet.kubeconfig + referenced client certificate/CA from this tree on
        # Rancher-provisioned nodes (e.g. BYOK worker clusters)
        # DirectoryOrCreate so the pod still starts on non-Rancher nodes.
        - name: host-rancher-vol
          hostPath:
            path: /var/lib/rancher
            type: DirectoryOrCreate

        {{- if .Values.gpud.mountNVIDIADriverRoot }}
        # GPU Operator installs its driver libraries under this host path.
        # gpud probes this well-known container path automatically when the
        # mount is present -- no environment variable is needed because the
        # path is fixed here and the mount is on by default. On
        # preinstalled-driver nodes this may be empty; gpud then preserves its
        # normal system-library lookup.
        - name: host-nvidia-driver
          hostPath:
            path: /run/nvidia/driver
            type: DirectoryOrCreate
        {{- end }}

        {{- if .Values.gpud.mountHostRoot }}
        # Host root filesystem, exposing pre-installed NVIDIA driver libraries
        # under /host/usr/lib*. Same "host-root" pattern as the GPU Operator's
        # DRA driver DaemonSet. gpud probes this well-known path automatically
        # (before the driver root, so a pre-installed host driver wins),
        # including the Operator's driver-ready contract at
        # /host/run/nvidia/validations/driver-ready -- again with no
        # environment variable, since the mount path is fixed.
        - name: host-root
          hostPath:
            path: /
            type: Directory
        {{- end }}

        {{- if .Values.gpud.mountContainerd }}
        # Host containerd runtime directory (holds containerd.sock).
        # Required by: components/containerd (stat the socket and reach the CRI endpoint).
        # DirectoryOrCreate so the pod still starts on nodes without containerd.
        # Disabling this mount does not disable the component.
        - name: host-run-containerd
          hostPath:
            path: {{ dir $socketPath | quote }}
            type: DirectoryOrCreate

        # Host containerd config directory (holds config.toml).
        # Required by: components/containerd (read the selected config to
        # verify the NVIDIA runtime is configured). Mounted read-only.
        - name: host-etc-containerd
          hostPath:
            path: {{ dir $configPath | quote }}
            type: DirectoryOrCreate
        {{- end }}

        {{- if .Values.gpud.mountCrio }}
        # Host CRI-O runtime directory (holds crio.sock).
        # Required by: components/containerd (dial the CRI endpoint at
        # unix:///run/crio/crio.sock to detect that CRI-O is the node's
        # container runtime, and skip the containerd check instead of
        # reporting a missing containerd socket as unhealthy).
        # DirectoryOrCreate so the pod still starts on nodes without CRI-O:
        # kubelet creates an empty /run/crio on such hosts, gpud finds no
        # crio.sock there, and the containerd check runs exactly as it would
        # without this mount.
        - name: host-run-crio
          hostPath:
            path: /run/crio
            type: DirectoryOrCreate
        {{- end }}

        {{- if .Values.gpud.nvsentinel.enabled }}
        # Host NVSentinel directory, shared with the NVSentinel
        # platform-connector pod (which mounts the same host directory). gpud
        # creates its PlatformConnector gRPC unix socket at
        # gpud.nvsentinel.socketPath here; the connector dials it. Requires
        # gpud v0.13.0+ (LEP-6075). DirectoryOrCreate so the pod starts on
        # nodes without NVSentinel: gpud then idles on the socket and the
        # connector, when it appears, finds and dials it.
        - name: nvsentinel-run
          hostPath:
            path: {{ dir .Values.gpud.nvsentinel.socketPath }}
            type: DirectoryOrCreate
        {{- end }}
      {{- if .Values.extraVolumes }}
      {{- toYaml .Values.extraVolumes | nindent 8 }}
      {{- end }}

      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- end }}

      # --- Containers ---
      # --- OPTIONAL: Init Containers ---
      # This section is entirely OPTIONAL and only renders when:
      # 1. nodeLabelExporter.enabled=true (for init-only Kubernetes node-label reading), OR
      # 2. Custom initContainers are specified in values.yaml
      # By default, nodeLabelExporter.enabled=false, so no label init container is created.
      {{- if or .Values.nodeLabelExporter.enabled .Values.initContainers }}
      initContainers:
        {{- if .Values.nodeLabelExporter.enabled }}
        # OPTIONAL: Node Label Reader Init Container
        # WHY init instead of a polling sidecar: gpud reads this file only while
        # building its startup command, so updates after exec cannot reconfigure
        # the running process. Fetching once before startup is therefore sufficient.
        # This init container retries until it atomically writes fresh node labels,
        # preventing gpud from starting with a missing or stale machine identity.
        # Enable with: nodeLabelExporter.enabled=true
        # Requires RBAC: nodeLabelExporter.rbac.create=true (creates ClusterRole for node read access)
        - name: node-label-init
          # Needs a shell-capable image; distroless kubectl images lack /bin/sh so the script would fail.
          image: "{{ .Values.nodeLabelExporter.image.repository }}:{{ .Values.nodeLabelExporter.image.tag }}"
          imagePullPolicy: {{ .Values.nodeLabelExporter.image.pullPolicy }}
          # No securityContext: the label file goes to a kubelet-created
          # (world-writable) emptyDir, so the kubectl image's default non-root
          # UID can write it. Nothing here touches the host.
          command:
            - /bin/sh
            - -ec
            - |
              set -o errexit
              set -o nounset
              # pipefail not supported in dash (Ubuntu's /bin/sh).
              # POSIX special builtins (like `set`) cause the shell to exit on failure
              # even in `|| true` constructs. A subshell safely isolates the test.
              if ( set -o pipefail ) 2>/dev/null; then set -o pipefail; fi

              tmp_file="${OUTPUT_FILE}.tmp"
              mkdir -p "$(dirname "${OUTPUT_FILE}")"

              # gpud consumes this file once at startup. Retry here rather than
              # relying on a sidecar: a sidecar could update the file later, but
              # cannot make the already-running gpud process reload it.
              while true; do
                if kubectl get node "${NODE_NAME}" \
                  -o go-template='{{`{{range $k,$v := .metadata.labels}}{{printf "%s=%s\n" $k $v}}{{end}}`}}' \
                  > "${tmp_file}"; then
                  # Atomic move prevents the main container from ever reading a
                  # partially written label file.
                  mv "${tmp_file}" "${OUTPUT_FILE}"
                  echo "Successfully wrote node labels to ${OUTPUT_FILE}"
                  break
                fi

                rm -f "${tmp_file}"
                echo "Waiting to fetch node labels for ${NODE_NAME}; retrying in 5 seconds"
                sleep 5
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OUTPUT_FILE
              value: {{ .Values.nodeLabelExporter.outputFile | quote }}
          {{- with .Values.nodeLabelExporter.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: node-labels
              mountPath: {{ dir .Values.nodeLabelExporter.outputFile }}
          {{- with .Values.nodeLabelExporter.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          # Uses the image tag from values.yaml, but defaults to the chart's appVersion if not set.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Privileged access is required for hardware inspection and low-level system access.
          # The default rebootCommands script also needs the privileges to enter host namespaces
          # and ask the host init system to reboot the node.
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
{{- if .Values.gpud.commandOverride }}
            {{- toYaml .Values.gpud.commandOverride | nindent 12 }}
{{- else }}
            - /bin/sh
            - -ec
            - |
              # Shell safety options:
              # - errexit: Exit immediately if any command fails
              # - nounset: Treat unset variables as errors
              # - pipefail: Pipeline fails if any command fails (not just the last)
              set -o errexit
              set -o nounset
              # pipefail not supported in dash (Ubuntu's /bin/sh).
              # POSIX special builtins (like `set`) cause the shell to exit on failure
              # even in `|| true` constructs. A subshell safely isolates the test.
              if ( set -o pipefail ) 2>/dev/null; then set -o pipefail; fi

              # --- OPTIONAL: Read configuration from Kubernetes node labels ---
              # When nodeLabelExporter is enabled, node-label-init writes node labels to this file.
              # This supplies endpoint/token/machine-id configuration for this gpud start.
              LABEL_FILE="{{ .Values.nodeLabelExporter.outputFile }}"
              NODE_LABEL_EXPORTER_ENABLED="{{ .Values.nodeLabelExporter.enabled }}"

              # Label keys can be overridden via environment variables (useful for testing)
              EP_LABEL_KEY="${GPUD_ENDPOINT_LABEL_KEY:-{{ .Values.nodeLabelExporter.labelKeys.endpoint }}}"
              TOKEN_LABEL_KEY="${GPUD_TOKEN_LABEL_KEY:-{{ .Values.nodeLabelExporter.labelKeys.token }}}"
              MID_LABEL_KEY="${GPUD_MACHINE_ID_LABEL_KEY:-{{ .Values.nodeLabelExporter.labelKeys.machineId }}}"

              # Initialize empty - will be populated from label file if it exists
              EP=""
              TOKEN=""
              MID=""
              INSTANCE_ID=""

              # The label file lives on a pod-scoped emptyDir, so it cannot be
              # stale by construction. Keep the enabled guard anyway: if
              # outputFile is overridden to a host-persisted path, disabling
              # nodeLabelExporter must still mean no leftover label file can
              # silently override the configured endpoint, token, or machine ID.
              if [ "$NODE_LABEL_EXPORTER_ENABLED" = "true" ] && [ -f "$LABEL_FILE" ]; then
                # Parse label file using awk with index() for EXACT string matching:
                # - index($0, key"=") == 1: Line must START with "key=" (prevents partial matches)
                # - substr($0, length(key)+2): Extract everything AFTER the "=" sign
                # - This handles dots/slashes in keys and preserves "=" in values (e.g., base64)
                # Example: "gpud.dgxc.lepton.ai/endpoint=https://api.example.com" -> "https://api.example.com"
                EP="$(awk -v key="$EP_LABEL_KEY" 'index($0, key"=") == 1 {print substr($0, length(key)+2); exit}' "$LABEL_FILE")"
                TOKEN="$(awk -v key="$TOKEN_LABEL_KEY" 'index($0, key"=") == 1 {print substr($0, length(key)+2); exit}' "$LABEL_FILE")"
                if [ -n "${GPUD_INSTANCE_ID_LABEL_KEY:-}" ]; then
                  INSTANCE_ID="$(awk -v key="$GPUD_INSTANCE_ID_LABEL_KEY" 'index($0, key"=") == 1 {print substr($0, length(key)+2); exit}' "$LABEL_FILE")"
                fi
                MID="$(awk -v key="$MID_LABEL_KEY" 'index($0, key"=") == 1 {print substr($0, length(key)+2); exit}' "$LABEL_FILE")"
              fi
              {{- if $hostBinary.enabled }}

              # --- GPUd binary kept on the node (gpud.hostBinary) ---
              # Run a copy of GPUd kept on the /var/lib/gpud hostPath instead of the
              # image binary. A self-update requested by the control plane replaces
              # the running executable, so with the node copy the update survives
              # container restarts, pod replacement and chart upgrades. The image
              # binary seeds a node that has no copy yet, and replaces a copy that
              # this chart cannot run.
              GPUD_IMAGE_BIN=/usr/local/bin/gpud
              GPUD_HOST_BIN=/var/lib/gpud/bin/gpud
              GPUD_STATE_FILE=/var/lib/gpud/gpud.state
              GPUD_SHIM_DIR=/tmp/gpud-shims
              GPUD_NEW_NODE_VERSION={{ $hostBinary.newNodeVersion | default "" | quote }}
              GPUD_REINSTALL_FROM_IMAGE={{ $hostBinary.reinstallFromImage | default false | quote }}
              GPUD_SELF_UPDATE=true
              # Oldest GPUd release that accepts every flag and environment variable
              # this wrapper passes: GPUD_TOKEN arrived in v0.14.1, and
              # --recovery-token-file and --instance-id in v0.14.4. Raise it when the
              # wrapper starts to pass something newer.
              GPUD_MIN_VERSION=v0.14.1
              {{- if $podIdentityRecovery.enabled }}
              GPUD_MIN_VERSION=v0.14.4
              {{- else }}
              if [ -n "$INSTANCE_ID" ]; then
                GPUD_MIN_VERSION=v0.14.4
              fi
              {{- end }}

              # Prints the version of the GPUd binary $1, or nothing if it cannot run.
              gpud_version() {
                { "$1" --version 2>/dev/null || true; } | awk '$1 == "gpud" && $2 == "version" { print $3; exit }'
              }

              # Succeeds when version $1 is older than version $2, ignoring a leading
              # "v". sort -V orders a pre-release such as 0.15.0-rc.1 after 0.15.0.
              gpud_version_older() {
                set -- "${1#v}" "${2#v}"
                [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | sed -n 1p)" = "$1" ]
              }

              # Copies the image binary to $1 through a temporary file and a rename,
              # so $1 is never a partial file.
              gpud_install_image_binary() {
                mkdir -p "$(dirname "$1")"
                cp "$GPUD_IMAGE_BIN" "$1.tmp"
                chmod 0755 "$1.tmp"
                mv -f "$1.tmp" "$1"
              }

              gpud_user_min_version={{ $hostBinary.minVersion | default "" | quote }}
              if [ -n "$gpud_user_min_version" ] && gpud_version_older "$GPUD_MIN_VERSION" "$gpud_user_min_version"; then
                GPUD_MIN_VERSION="$gpud_user_min_version"
              fi

              # GPUd releases up to v0.14.4 read the Ubuntu version that selects
              # their release tarball only from lsb_release, which the image does
              # not install. They then ask for a generic Linux tarball that is not
              # published, and every update would fail. Give them a minimal
              # lsb_release that reads /etc/os-release.
              if ! command -v lsb_release >/dev/null 2>&1 && mkdir -p "$GPUD_SHIM_DIR" 2>/dev/null &&
                printf '%s\n' \
                  '#!/bin/sh' \
                  '# Subset of lsb_release that GPUd uses to choose its release tarball.' \
                  '[ -r /etc/os-release ] || exit 1' \
                  '. /etc/os-release' \
                  'case "$*" in' \
                  '"-i -s" | -is | -si) echo "${ID:-}" ;;' \
                  '"-r -s" | -rs | -sr) echo "${VERSION_ID:-}" ;;' \
                  '*) exit 1 ;;' \
                  'esac' >"$GPUD_SHIM_DIR/lsb_release" 2>/dev/null &&
                chmod 0755 "$GPUD_SHIM_DIR/lsb_release"; then
                export PATH="$GPUD_SHIM_DIR:$PATH"
              fi

              if [ "$GPUD_REINSTALL_FROM_IMAGE" = "true" ]; then
                echo "gpud.hostBinary.reinstallFromImage is set: installing the image binary at $GPUD_HOST_BIN with self-update off"
                gpud_install_image_binary "$GPUD_HOST_BIN"
                GPUD_SELF_UPDATE=false
              elif [ ! -e "$GPUD_HOST_BIN" ]; then
                # No copy yet. Prepare it under another name: if the container stops
                # during the download, the next start tries again instead of keeping
                # the image version.
                gpud_seed="$GPUD_HOST_BIN.seed"
                gpud_install_image_binary "$gpud_seed"
                gpud_image_version="$(gpud_version "$gpud_seed")"
                gpud_target="$GPUD_NEW_NODE_VERSION"
                if [ -n "$gpud_target" ] && [ -e "$GPUD_STATE_FILE" ]; then
                  # GPUd already ran on this node, from an image, before
                  # gpud.hostBinary was enabled. Keep the image version, so that
                  # enabling it does not change GPUd on every node in the cluster.
                  echo "GPUd ran on this node before gpud.hostBinary was enabled; keeping the image binary $gpud_image_version"
                  gpud_target=""
                fi
                if [ "$gpud_target" = "latest" ]; then
                  # Resolve the stable track here, as install.sh does. Without a
                  # version, "gpud update" picks the track from its own version.
                  gpud_target="$({ curl -fsSL --max-time 30 https://pkg.gpud.dev/stable_latest.txt 2>/dev/null || true; } | tr -d '[:space:]')"
                  if [ -n "$gpud_target" ]; then
                    gpud_target="v${gpud_target#v}"
                  fi
                  case "$gpud_target" in
                    v[0-9]*[!0-9A-Za-z.+-]* | v[!0-9]* | v | "")
                      echo "could not read the latest stable GPUd release; keeping the image binary" >&2
                      gpud_target=""
                      ;;
                  esac
                  if [ -n "$gpud_target" ] && gpud_version_older "$gpud_target" "$gpud_image_version"; then
                    echo "the latest stable release $gpud_target is older than the image binary $gpud_image_version; keeping the image binary"
                    gpud_target=""
                  fi
                fi
                if [ -n "$gpud_target" ] && gpud_version_older "$gpud_target" "$GPUD_MIN_VERSION"; then
                  echo "GPUd $gpud_target is older than the minimum version $GPUD_MIN_VERSION; keeping the image binary" >&2
                  gpud_target=""
                fi
                if [ -n "$gpud_target" ] && [ "$gpud_target" = "$gpud_image_version" ]; then
                  echo "the image binary is already GPUd $gpud_target"
                elif [ -n "$gpud_target" ] && "$gpud_seed" --version >/dev/null 2>&1; then
                  echo "installing GPUd $gpud_target on this node"
                  # Limit the download time, so an unreachable release server falls
                  # back to the image binary before the startup probe gives up.
                  set -- "$gpud_seed" update --next-version="$gpud_target"
                  if command -v timeout >/dev/null 2>&1; then
                    set -- timeout 120 "$@"
                  fi
                  if ! "$@"; then
                    echo "could not install GPUd $gpud_target; keeping the image binary" >&2
                    gpud_install_image_binary "$gpud_seed"
                  fi
                  set --
                fi
                mv -f "$gpud_seed" "$GPUD_HOST_BIN"
              fi

              # A copy below the minimum version, for example after a rollback,
              # would exit at every start, out of reach of the control plane.
              # Replace it with the image binary.
              if [ "$GPUD_REINSTALL_FROM_IMAGE" != "true" ]; then
                gpud_host_version="$(gpud_version "$GPUD_HOST_BIN")"
                gpud_image_version="$(gpud_version "$GPUD_IMAGE_BIN")"
                if [ -n "$gpud_host_version" ] && gpud_version_older "$gpud_host_version" "$GPUD_MIN_VERSION"; then
                  if gpud_version_older "$gpud_image_version" "$GPUD_MIN_VERSION"; then
                    echo "the image binary $gpud_image_version is older than the minimum version $GPUD_MIN_VERSION; keeping $gpud_host_version" >&2
                  else
                    echo "$GPUD_HOST_BIN $gpud_host_version is older than the minimum version $GPUD_MIN_VERSION; installing the image binary $gpud_image_version" >&2
                    gpud_install_image_binary "$GPUD_HOST_BIN"
                  fi
                fi
              fi

              if ! "$GPUD_HOST_BIN" --version >/dev/null 2>&1; then
                # Tell a broken copy from a directory that cannot run programs: if
                # a fresh copy of the image binary runs there, replace the broken
                # copy with it.
                gpud_install_image_binary "$GPUD_HOST_BIN.check"
                if "$GPUD_HOST_BIN.check" --version >/dev/null 2>&1; then
                  echo "cannot run $GPUD_HOST_BIN; installing the image binary" >&2
                  mv -f "$GPUD_HOST_BIN.check" "$GPUD_HOST_BIN"
                else
                  rm -f "$GPUD_HOST_BIN.check"
                fi
              fi
              if "$GPUD_HOST_BIN" --version >/dev/null 2>&1; then
                GPUD_BIN="$GPUD_HOST_BIN"
              else
                # For example, the node mounts /var/lib/gpud with noexec. An update
                # could not persist there, so turn self-update off. The control plane
                # then gets an error instead of an update that the next restart undoes.
                echo "cannot run $GPUD_HOST_BIN; running the image binary with self-update off" >&2
                GPUD_BIN="$GPUD_IMAGE_BIN"
                GPUD_SELF_UPDATE=false
              fi
              echo "GPUd binary: $GPUD_BIN $(gpud_version "$GPUD_BIN")"
              {{- end }}

              # --- Build gpud command arguments ---
              # Using "set --" to safely build argument list without eval or quoting issues.
              # Each "set -- "$@" ..." appends to the positional parameters ($1, $2, etc.)
              set -- run
              set -- "$@" --listen-address="{{ .Values.gpud.listenAddress }}"
              set -- "$@" --log-level="{{ .Values.gpud.logLevel }}"
              # Profile updates restart gpud. Keep the specs on the existing
              # hostPath so both container restarts and pod replacement reload them.
              set -- "$@" --plugin-specs-file=/var/lib/gpud/gpud.plugins.yaml --plugin-specs-file-managed

              # Endpoint priority: Node label > values.yaml > (none)
              ENDPOINT="{{ .Values.gpud.endpoint }}"
              {{- if $podIdentityRecovery.enabled }}
              # Send the pod credential only to the operator-configured endpoint.
              set -- "$@" --recovery-token-file=/var/run/gpud-recovery/token
              {{- else }}
              if [ -n "$EP" ]; then
                ENDPOINT="$EP"  # Label value overrides values.yaml
              fi
              {{- end }}
              if [ -n "$ENDPOINT" ]; then
                set -- "$@" --endpoint="$ENDPOINT"
              fi

              # A token Secret (gpud.tokenSecret) is injected as GPUD_TOKEN and
              # takes priority over any token node label. This supports clusters
              # that store the enrollment token in a Secret rather than a label.
              if [ -n "${GPUD_TOKEN:-}" ]; then
                TOKEN="$GPUD_TOKEN"
              fi

              # Token vs machine-id are intentionally sourced differently:
              #   GPUD_TOKEN: a SHARED, cluster/node-group enrollment credential
              #     ("may I join?"). Every node uses the same token (from the
              #     gpud.tokenSecret Secret, or a token label). It does NOT
              #     identify the machine.
              #   --machine-id: the UNIQUE per-node identity ("who am I?"), read
              #     from each node's machine-id label. Passing it keeps the node
              #     registered as the SAME machine across restarts/replacement.
              # Pass the credential through the environment so neither the startup
              # log nor the process argument list contains its value.
              token_status="unset"
              if [ -n "$TOKEN" ]; then
                {{- if $hostBinary.enabled }}
                if [ "$GPUD_BIN" = "$GPUD_HOST_BIN" ] && ! GPUD_TOKEN= "$GPUD_BIN" up --help 2>/dev/null | grep -q GPUD_TOKEN; then
                  echo "$GPUD_HOST_BIN $(gpud_version "$GPUD_HOST_BIN") does not read GPUD_TOKEN; installing the image binary" >&2
                  gpud_install_image_binary "$GPUD_HOST_BIN"
                fi
                {{- end }}
                # An overridden older image could silently skip enrollment.
                # Check the advertised capability before handing it a credential.
                if ! GPUD_TOKEN= {{ $gpudBin }} up --help 2>/dev/null | grep -q GPUD_TOKEN; then
                  echo "this gpud image does not read GPUD_TOKEN; use the image from the same release" >&2
                  exit 1
                fi
                export GPUD_TOKEN="$TOKEN"
                token_status="set"
              else
                # Leave tokenless starts without a credential in the environment.
                unset GPUD_TOKEN
              fi
              unset TOKEN
              if [ -n "$INSTANCE_ID" ]; then
                set -- "$@" --instance-id="$INSTANCE_ID"
              fi
              if [ -n "$MID" ]; then
                set -- "$@" --machine-id="$MID"
              fi

              # When the node's machine-id label changes (the node was deleted from
              # its node group and rejoined, binding a NEW machine object), the
              # persisted /var/lib/gpud identity is stale. --machine-id-overwrite
              # tells gpud to discard that stale identity and check in with the
              # requested machine instead of failing. Reboot/health state is preserved.
              if [ "${GPUD_MACHINE_ID_OVERWRITE:-}" = "true" ]; then
                set -- "$@" --machine-id-overwrite
              fi

              # Re-login needs the registration token injected above. Keep this opt-in
              # for BYOK deployments that provide that token on every start.
              if [ "${GPUD_REFRESH_SESSION_TOKEN:-}" = "true" ]; then
                set -- "$@" --refresh-session-token
              fi

              if [ "${GPUD_REQUIRE_NVIDIA_DRIVER:-}" = "true" ]; then
                set -- "$@" --require-nvidia-driver
              fi

              if [ -n "${GPUD_REGION:-}" ]; then
                set -- "$@" --region="$GPUD_REGION"
              fi

              if [ -n "${GPUD_COMPONENTS:-}" ]; then
                set -- "$@" --components="$GPUD_COMPONENTS"
              fi

              {{- if $hostBinary.enabled }}
              if [ "$GPUD_SELF_UPDATE" = "true" ]; then
                set -- "$@" --enable-auto-update={{ .Values.gpud.enableAutoUpdate }}
                set -- "$@" --auto-update-exit-code={{ .Values.gpud.autoUpdateExitCode }}
              else
                set -- "$@" --enable-auto-update=false
                set -- "$@" --auto-update-exit-code=-1
              fi
              # Only the control plane changes the node copy. Otherwise GPUd also
              # polls /var/lib/gpud/target_version on the hostPath and moves to any
              # version written there, which would undo control-plane updates.
              set -- "$@" --version-file=
              {{- else }}

              set -- "$@" --enable-auto-update={{ .Values.gpud.enableAutoUpdate }}
              set -- "$@" --auto-update-exit-code={{ .Values.gpud.autoUpdateExitCode }}
              {{- end }}

              {{- if .Values.gpud.nvsentinel.enabled }}
              # NVSentinel sink: serve the PlatformConnector gRPC API on this unix
              # socket. This is a pure listener -- it never dials NVSentinel, so it
              # is safe on nodes without NVSentinel and simply receives events
              # whenever a platform-connector comes online and starts forwarding.
              set -- "$@" --nvsentinel-endpoint="{{ .Values.gpud.nvsentinel.socketPath }}"
              {{- end }}

              # The chart default sets a host-namespace reboot script. Users can
              # set gpud.rebootCommands="" to preserve gpud's built-in sudo reboot path.
              if [ -n "${GPUD_REBOOT_COMMANDS:-}" ]; then
                set -- "$@" --reboot-commands="$GPUD_REBOOT_COMMANDS"
              fi

              # The chart default wraps the disk component's host tools with
              # nsenter so they read the node's disks instead of the container's
              # overlay. Users can set the corresponding gpud.*Commands value to
              # "" to preserve gpud's built-in in-namespace behavior.
              if [ -n "${GPUD_FINDMNT_COMMANDS:-}" ]; then
                set -- "$@" --findmnt-commands="$GPUD_FINDMNT_COMMANDS"
              fi
              if [ -n "${GPUD_LSBLK_COMMANDS:-}" ]; then
                set -- "$@" --lsblk-commands="$GPUD_LSBLK_COMMANDS"
              fi
              if [ -n "${GPUD_BLOCKDEV_USAGE_COMMANDS:-}" ]; then
                set -- "$@" --blockdev-usage-commands="$GPUD_BLOCKDEV_USAGE_COMMANDS"
              fi

              # BYOK: this is a node filesystem prefix, not a required NFS mount.
              # It lets gpud resolve only the NFS paths configured for this
              # machine through /proc/1/root. Nodes without an NFS config do not
              # probe a path, and a missing configured mount degrades the check
              # without preventing this DaemonSet pod from starting. Systemd
              # installations do not use this Helm-only default.
              if [ -n "${GPUD_NFS_HOST_ROOT:-}" ]; then
                set -- "$@" --nfs-host-root="$GPUD_NFS_HOST_ROOT"
              fi
              if [ -n "${GPUD_CONTAINERD_SERVICE_ACTIVE_COMMANDS:-}" ]; then
                set -- "$@" --containerd-service-active-commands="$GPUD_CONTAINERD_SERVICE_ACTIVE_COMMANDS"
              fi

              {{- if $configuredRuntime }}
              set -- "$@" --containerd-endpoint="$GPUD_CONTAINERD_ENDPOINT" \
                --containerd-config-path="$GPUD_CONTAINERD_CONFIG_PATH" \
                --containerd-service-name="$GPUD_CONTAINERD_SERVICE_NAME" \
                --containerd-systemctl-commands="$GPUD_CONTAINERD_SYSTEMCTL_COMMANDS"
              {{- end }}

              # Using exec ensures gpud receives signals directly (important for graceful shutdown).
              # Never reconstruct a log from argv: future flags can carry secrets too.
              {{- if $hostBinary.enabled }}
              printf 'Starting: %s run (token=<%s>)\n' "$GPUD_BIN" "$token_status"
              {{- else }}
              printf 'Starting: /usr/local/bin/gpud run (token=<%s>)\n' "$token_status"
              {{- end }}
              exec {{ $gpudBin }} "$@"
{{- end }}

          env:
            - name: GPUD_NO_USAGE_STATS
              value: {{ not .Values.gpud.telemetry.enabled | quote }}
            {{- if .Values.gpud.tokenSecret.name }}
            # Enrollment token sourced from an existing Secret (takes priority over a
            # token node label). Consumed by the startup script as $GPUD_TOKEN.
            - name: GPUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gpud.tokenSecret.name | quote }}
                  key: {{ .Values.gpud.tokenSecret.key | quote }}
            {{- end }}
            {{- with .Values.nodeLabelExporter.labelKeys.providerInstanceId }}
            - name: GPUD_INSTANCE_ID_LABEL_KEY
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.gpud.machineIdOverwrite }}
            # Allow a changed machine-id label to check in the node (see the
            # startup script). Consumed as $GPUD_MACHINE_ID_OVERWRITE.
            - name: GPUD_MACHINE_ID_OVERWRITE
              value: "true"
            {{- end }}
            {{- if .Values.gpud.refreshSessionToken }}
            # BYOK only: re-login on startup using the injected registration token.
            # Consumed as $GPUD_REFRESH_SESSION_TOKEN.
            - name: GPUD_REFRESH_SESSION_TOKEN
              value: "true"
            {{- end }}
            {{- if .Values.gpud.requireNVIDIADriver }}
            # BYOK: do not register NVIDIA GPU hardware until the driver and
            # NVML are available. CPU-only nodes are unaffected.
            - name: GPUD_REQUIRE_NVIDIA_DRIVER
              value: "true"
            {{- end }}
            {{- if .Values.gpud.region }}
            - name: GPUD_REGION
              value: {{ .Values.gpud.region | quote }}
            {{- end }}
            {{- if .Values.gpud.components }}
            # Component selection, consumed by the startup script as
            # $GPUD_COMPONENTS and passed to "gpud run --components".
            - name: GPUD_COMPONENTS
              value: {{ include "gpud.componentsArg" . | quote }}
            {{- end }}
            {{- if .Values.gpud.rebootCommands }}
            - name: GPUD_REBOOT_COMMANDS
              value: {{ .Values.gpud.rebootCommands | quote }}
            {{- end }}
            {{- if .Values.gpud.findmntCommands }}
            - name: GPUD_FINDMNT_COMMANDS
              value: {{ .Values.gpud.findmntCommands | quote }}
            {{- end }}
            {{- if .Values.gpud.lsblkCommands }}
            - name: GPUD_LSBLK_COMMANDS
              value: {{ .Values.gpud.lsblkCommands | quote }}
            {{- end }}
            {{- if .Values.gpud.blockdevUsageCommands }}
            - name: GPUD_BLOCKDEV_USAGE_COMMANDS
              value: {{ .Values.gpud.blockdevUsageCommands | quote }}
            {{- end }}
            {{- if .Values.gpud.nfsHostRoot }}
            # BYOK: this value is only a host filesystem prefix. It does not
            # assert that any particular NFS path exists on every DaemonSet node.
            - name: GPUD_NFS_HOST_ROOT
              value: {{ .Values.gpud.nfsHostRoot | quote }}
            {{- end }}
            {{- if $activeCommands }}
            - name: GPUD_CONTAINERD_SERVICE_ACTIVE_COMMANDS
              value: {{ $activeCommands | quote }}
            {{- end }}
            {{- if $configuredRuntime }}
            - name: GPUD_CONTAINERD_ENDPOINT
              value: {{ $endpoint | quote }}
            - name: GPUD_CONTAINERD_CONFIG_PATH
              value: {{ $configPath | quote }}
            - name: GPUD_CONTAINERD_SERVICE_NAME
              value: {{ $serviceName | quote }}
            - name: GPUD_CONTAINERD_SYSTEMCTL_COMMANDS
              value: {{ $containerd.systemctlCommands | default "nsenter --target 1 --mount -- systemctl" | quote }}
            {{- end }}
            {{- with .Values.gpud.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          {{- if .Values.service.enabled }}
          ports:
            - name: https
              # Must match the port in gpud.listenAddress (default 15132)
              # Uses service.port for reliability - livenessProbe.httpGet.port may not exist
              # if user customizes livenessProbe to use exec or tcpSocket instead of httpGet.
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- end }}

          {{- if .Values.livenessProbe }}
          {{- if not .Values.startupProbe }}
          {{- fail "startupProbe is required when livenessProbe is enabled; gpud performs login and machine-info collection before /healthz starts" }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          # No readinessProbe is defined
          {{- with .Values.startupProbe }}
          # Gives slow control-plane login/machine-info time to finish before
          # the liveness probe starts (liveness stays off until the first
          # successful startup probe). Disabling requires livenessProbe: null too.
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          # Omitted entirely when values sets "resources: null", so the
          # DaemonSet consumes none of the node's allocatable resources.
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            {{- if $podIdentityRecovery.enabled }}
            - name: login-recovery
              mountPath: /var/run/gpud-recovery
              readOnly: true
            {{- end }}
            # System logs - GPUd writes logs here and monitors system logs
            - name: host-log
              mountPath: /var/log

            # Kernel crash dumps and persistent storage for error analysis
            - name: host-pstore
              mountPath: /var/lib/systemd/pstore

            # Device files - Critical for:
            # - /dev/kmsg: kernel message buffer (pkg/kmsg/watcher.go)
            # - /dev/nvidia*: GPU devices for NVIDIA monitoring
            # - /dev/dri/*: GPU DRM devices
            - name: host-dev
              mountPath: /dev

            {{- if .Values.gpud.mountHostSys }}
            # Sysfs - Hardware/device info (read-only for safety)
            # - /sys/class/infiniband: InfiniBand network monitoring
            # - /sys/class/dmi: Hardware/DMI information
            # - /sys/fs/fuse/connections: FUSE filesystem stats
            - name: host-sys
              mountPath: /sys
              readOnly: true
            {{- end }}

            {{- if .Values.gpud.mountHostProc }}
            # Procfs - Kernel/process info (read-only for safety)
            # - /proc/sys/fs/file-*: File descriptor limits and usage
            # - /proc/sys/kernel/random/boot_id: Unique boot identifier
            # - /proc/self/mountinfo: Current mount points
            - name: host-proc
              mountPath: /proc
              readOnly: true
            {{- end }}

            # GPUd data directory for runtime state and configuration
            - name: lib-gpud
              mountPath: /var/lib/gpud

            {{- if .Values.nodeLabelExporter.enabled }}
            # Node-label snapshot written by node-label-init; the startup
            # script reads endpoint/token/machine-id from it once.
            - name: node-labels
              mountPath: {{ dir .Values.nodeLabelExporter.outputFile }}
              readOnly: true
            {{- end }}

            # Machine ID for unique node identification (read-only)
            - name: host-machine-id
              mountPath: /etc/machine-id
              readOnly: true

            {{- if .Values.gpud.mountHostDevMem }}
            # Physical memory access for hardware diagnostics (read-only)
            # Conditional mount - can be disabled for GKE/restricted environments
            # via gpud.mountHostDevMem=false (addresses issue #1144)
            - name: host-dev-mem
              mountPath: /dev/mem
              readOnly: true
            {{- end }}

            # Kubelet data for container/pod monitoring (read-only)
            - name: host-kubelet-vol
              mountPath: /var/lib/kubelet
              readOnly: true

            # Rancher agent data for kubelet client credentials (read-only)
            # Holds kubelet.kubeconfig + client certs on k3s/RKE2 nodes
            - name: host-rancher-vol
              mountPath: /var/lib/rancher
              readOnly: true

            {{- if .Values.gpud.mountNVIDIADriverRoot }}
            # GPU Operator-managed driver libraries. Read-only because gpud only
            # loads NVML and never modifies the driver installation.
            # HostToContainer so an Operator driver (re)install that creates
            # mounts under /run/nvidia/driver is visible without a pod restart.
            - name: host-nvidia-driver
              mountPath: /run/nvidia/driver
              readOnly: true
              mountPropagation: HostToContainer
            {{- end }}

            {{- if .Values.gpud.mountHostRoot }}
            # Pre-installed host driver libraries under /host/usr/lib*.
            # Read-only; HostToContainer mirrors the GPU Operator's DRA driver
            # DaemonSet so host driver changes propagate into the container.
            - name: host-root
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
            {{- end }}

            {{- if .Values.gpud.mountContainerd }}
            # Host containerd socket directory for containerd monitoring.
            # Mounted at the selected endpoint's parent directory.
            # Not read-only: connecting to the CRI unix socket requires write access.
            - name: host-run-containerd
              mountPath: {{ dir $socketPath | quote }}

            # Host containerd config for the NVIDIA-runtime check (read-only).
            # Mounted at the selected config's parent directory.
            - name: host-etc-containerd
              mountPath: {{ dir $configPath | quote }}
              readOnly: true
            {{- end }}

            {{- if .Values.gpud.mountCrio }}
            # Host CRI-O socket directory for the containerd component's CRI-O
            # detection. Mounted at the same path gpud expects
            # (/run/crio/crio.sock). Not read-only: connecting to the CRI unix
            # socket requires write access (same reason /run/containerd is rw).
            - name: host-run-crio
              mountPath: /run/crio
            {{- end }}

            {{- if .Values.gpud.nvsentinel.enabled }}
            # Host NVSentinel directory shared with the platform-connector pod.
            # Not read-only: gpud creates/removes its unix socket file here.
            - name: nvsentinel-run
              mountPath: {{ dir .Values.gpud.nvsentinel.socketPath }}
            {{- end }}
          {{- if .Values.extraVolumeMounts }}
          {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
          {{- end }}
