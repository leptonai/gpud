name: Docker image (PR)

# Manual snapshot for a pull request. Does not retag :latest or v*.*.* releases.
"on":
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number (image tag pr-<n>)
        required: true
        type: string

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR number
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.pr_number }}" =~ ^[0-9]+$ ]]; then
            echo "pr_number must be digits, got: ${{ inputs.pr_number }}" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to NGC
        uses: docker/login-action@v4
        with:
          registry: nvcr.io
          username: $oauthtoken
          password: ${{ secrets.NVAPI_KEY }}

      - name: Build and push PR image
        shell: bash
        run: |
          set -euo pipefail
          image=nvcr.io/nvstaging/lepton/gpud
          pr="${{ inputs.pr_number }}"
          version="0.0.0-pr.${pr}.${GITHUB_SHA:0:7}"

          ./scripts/build-docker.sh \
            --version "$version" \
            --tag "$image:pr-${pr}" \
            --push
